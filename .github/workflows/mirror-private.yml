name: Mirror to Private Repo

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify token access
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token ${TOKEN}" https://api.github.com/repos/187Lucka/CV-private)
          echo "API response: ${STATUS}"
          if [ "${STATUS}" != "200" ]; then
            echo "Token cannot access CV-private (HTTP ${STATUS})"
            exit 1
          fi

      - name: Push mirror to private repo
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          B64=$(printf 'x-access-token:%s' "${TOKEN}" | base64 | tr -d '\n')
          git remote add private https://github.com/187Lucka/CV-private.git
          git config --local http.https://github.com/187Lucka/CV-private/.extraheader "Authorization: Basic ${B64}"
          git push private main --force
