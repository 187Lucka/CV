name: Mirror to Private Repo

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify token access
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token ${TOKEN}" https://api.github.com/repos/187Lucka/CV-private)
          echo "API response: ${STATUS}"
          if [ "${STATUS}" != "200" ]; then
            echo "Token cannot access CV-private (HTTP ${STATUS})"
            exit 1
          fi

      - name: Push mirror to private repo
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          REMOTE_URL="https://x-access-token:${TOKEN}@github.com/187Lucka/CV-private.git"
          git remote add private "${REMOTE_URL}"
          git push private main --force
